<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap');

        body {
            background: linear-gradient(160deg, #0f172a 0%, #1e3a5f 100%);
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            color: white;
            padding: 2rem 1rem;
        }
        .btn-voltar {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }
        .btn-voltar:hover { color: white; }

        .search-area {
            max-width: 540px;
            margin: 0 auto 2rem;
            display: flex;
            gap: 0.5rem;
        }
        .search-input {
            flex: 1;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 14px;
            padding: 0.85rem 1.2rem;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
        }
        .search-input::placeholder { color: rgba(255,255,255,0.35); }
        .search-input:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(255,255,255,0.12);
        }
        .btn-search {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
            border: none;
            border-radius: 14px;
            padding: 0 1.4rem;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-search:hover { transform: scale(1.05); }

        .weather-card {
            max-width: 540px;
            margin: 0 auto;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 2rem;
            display: none;
        }
        .city-name {
            font-size: 1.8rem;
            font-weight: 700;
        }
        .weather-main {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin: 1.5rem 0;
        }
        .weather-icon {
            font-size: 5rem;
            line-height: 1;
        }
        .temp-big {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
        }
        .temp-unit { font-size: 2rem; color: rgba(255,255,255,0.5); }
        .weather-desc {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.6);
            text-transform: capitalize;
        }
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .weather-stat {
            background: rgba(255,255,255,0.06);
            border-radius: 14px;
            padding: 0.9rem;
            text-align: center;
        }
        .stat-label {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }
        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
        }
        .stat-value i { font-size: 1rem; margin-right: 0.3rem; color: #60a5fa; }

        .error-msg {
            max-width: 540px;
            margin: 0 auto;
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 14px;
            padding: 1rem 1.5rem;
            display: none;
        }
        .loading {
            max-width: 540px;
            margin: 0 auto;
            text-align: center;
            color: rgba(255,255,255,0.4);
            display: none;
            padding: 2rem;
        }

        /* Preset cities */
        .presets {
            max-width: 540px;
            margin: 0 auto 1rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .preset-btn {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            padding: 0.3rem 0.9rem;
            color: rgba(255,255,255,0.6);
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .preset-btn:hover { background: rgba(96,165,250,0.2); color: white; border-color: #60a5fa; }

        /* API key warning */
        .api-note {
            max-width: 540px;
            margin: 0 auto;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.3);
            text-align: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="btn-voltar">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao Portfólio
        </a>

        <div class="search-area">
            <input type="text" class="search-input" id="inputCidade" placeholder="Digite o nome da cidade..." />
            <button class="btn-search" onclick="buscarClima()">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <div class="presets">
            <button class="preset-btn" onclick="buscarPreset('Porto Velho')">Porto Velho</button>
            <button class="preset-btn" onclick="buscarPreset('São Paulo')">São Paulo</button>
            <button class="preset-btn" onclick="buscarPreset('Rio de Janeiro')">Rio de Janeiro</button>
            <button class="preset-btn" onclick="buscarPreset('Brasília')">Brasília</button>
        </div>

        <div class="loading" id="loading">
            <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
            <p class="mt-2">Buscando clima...</p>
        </div>

        <div class="error-msg" id="errorMsg">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="errorText"> Cidade não encontrada. Verifique o nome e tente novamente.</span>
        </div>

        <div class="weather-card" id="weatherCard">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <div class="city-name" id="cityName">—</div>
                    <div style="color:rgba(255,255,255,0.4); font-size:0.85rem;" id="dateLabel"></div>
                </div>
                <div style="font-size:0.8rem; color:rgba(255,255,255,0.3);" id="countryFlag"></div>
            </div>

            <div class="weather-main">
                <div class="weather-icon" id="weatherIcon">☁️</div>
                <div>
                    <div>
                        <span class="temp-big" id="tempBig">—</span>
                        <span class="temp-unit">°C</span>
                    </div>
                    <div class="weather-desc" id="weatherDesc">—</div>
                </div>
            </div>

            <div class="weather-grid">
                <div class="weather-stat">
                    <div class="stat-label">Sensação</div>
                    <div class="stat-value" id="feelsLike">—</div>
                </div>
                <div class="weather-stat">
                    <div class="stat-label">Umidade</div>
                    <div class="stat-value" id="humidity">—</div>
                </div>
                <div class="weather-stat">
                    <div class="stat-label">Vento</div>
                    <div class="stat-value" id="wind">—</div>
                </div>
            </div>
        </div>

        <p class="api-note">Powered by OpenWeatherMap API</p>
    </div>

    <script>
        // API key de demonstração — substitua pela sua em https://openweathermap.org/api
        const API_KEY = 'bd5e378503939ddaee76f12ad7a97608';

        const weatherIcons = {
            '01': '☀️', '02': '⛅', '03': '☁️', '04': '☁️',
            '09': '🌧️', '10': '🌦️', '11': '⛈️', '13': '❄️', '50': '🌫️'
        };

        function getIcon(iconCode) {
            const key = iconCode.slice(0, 2);
            return weatherIcons[key] || '🌡️';
        }

        function buscarPreset(cidade) {
            document.getElementById('inputCidade').value = cidade;
            buscarClima();
        }

        async function buscarClima() {
            const cidade = document.getElementById('inputCidade').value.trim();
            if (!cidade) return;

            const card = document.getElementById('weatherCard');
            const err = document.getElementById('errorMsg');
            const loading = document.getElementById('loading');

            card.style.display = 'none';
            err.style.display = 'none';
            loading.style.display = 'block';

            try {
                const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(cidade)}&appid=${API_KEY}&units=metric&lang=pt_br`;
                const res = await fetch(url);
                const data = await res.json();

                loading.style.display = 'none';

                if (data.cod !== 200) {
                    err.style.display = 'block';
                    document.getElementById('errorText').textContent = ' ' + (data.message || 'Cidade não encontrada.');
                    return;
                }

                document.getElementById('cityName').textContent = data.name;
                document.getElementById('countryFlag').textContent = `🌍 ${data.sys.country}`;
                document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'});
                document.getElementById('tempBig').textContent = Math.round(data.main.temp);
                document.getElementById('weatherDesc').textContent = data.weather[0].description;
                document.getElementById('weatherIcon').textContent = getIcon(data.weather[0].icon);
                document.getElementById('feelsLike').textContent = Math.round(data.main.feels_like) + '°C';
                document.getElementById('humidity').textContent = data.main.humidity + '%';
                document.getElementById('wind').textContent = Math.round(data.wind.speed * 3.6) + ' km/h';

                card.style.display = 'block';

            } catch (e) {
                loading.style.display = 'none';
                err.style.display = 'block';
                document.getElementById('errorText').textContent = ' Erro de conexão. Verifique sua internet.';
            }
        }

        document.getElementById('inputCidade').addEventListener('keydown', e => {
            if (e.key === 'Enter') buscarClima();
        });

        // Buscar Porto Velho ao abrir
        buscarPreset('Porto Velho');
    </script>
</body>
</html>
