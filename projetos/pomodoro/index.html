<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Pomodoro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap');

        body {
            background: radial-gradient(ellipse at center, #1a0533 0%, #0d001a 100%);
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: white;
        }
        .btn-voltar {
            position: fixed;
            top: 1.5rem; left: 1.5rem;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s;
        }
        .btn-voltar:hover { color: white; }

        .mode-tabs {
            display: flex;
            gap: 0.5rem;
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 0.4rem;
            margin-bottom: 2.5rem;
        }
        .mode-tab {
            padding: 0.45rem 1.1rem;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.5);
            font-family: 'Outfit', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-tab.active {
            background: #7c3aed;
            color: white;
        }

        .timer-ring-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            margin-bottom: 2rem;
        }
        .timer-ring-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }
        .ring-bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 8; }
        .ring-progress {
            fill: none;
            stroke: #a78bfa;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s linear;
        }
        .timer-label {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .timer-display {
            font-size: 3.8rem;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1;
        }
        .timer-mode-label {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0.3rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
            margin-bottom: 2rem;
        }
        .btn-control {
            width: 52px; height: 52px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-control:hover { background: rgba(255,255,255,0.15); }
        .btn-play {
            width: 70px; height: 70px;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            border-color: transparent;
        }
        .btn-play:hover { transform: scale(1.05); }

        .session-dots {
            display: flex;
            gap: 0.5rem;
        }
        .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            transition: background 0.3s;
        }
        .dot.done { background: #a78bfa; }
    </style>
</head>
<body>
    <a href="../../index.html" class="btn-voltar">
        <i class="fa-solid fa-arrow-left"></i> Voltar ao Portfólio
    </a>

    <div class="mode-tabs">
        <button class="mode-tab active" onclick="setMode('pomodoro', this)">Pomodoro</button>
        <button class="mode-tab" onclick="setMode('short', this)">Pausa Curta</button>
        <button class="mode-tab" onclick="setMode('long', this)">Pausa Longa</button>
    </div>

    <div class="timer-ring-wrapper">
        <svg class="timer-ring-svg" viewBox="0 0 100 100">
            <circle class="ring-bg" cx="50" cy="50" r="44"/>
            <circle class="ring-progress" id="ring" cx="50" cy="50" r="44"
                stroke-dasharray="276.5"
                stroke-dashoffset="0"/>
        </svg>
        <div class="timer-label">
            <div class="timer-display" id="display">25:00</div>
            <div class="timer-mode-label" id="modeLabel">Foco</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-control" onclick="resetTimer()" title="Reiniciar">
            <i class="fa-solid fa-rotate-left"></i>
        </button>
        <button class="btn-control btn-play" id="btnPlay" onclick="toggleTimer()">
            <i class="fa-solid fa-play" id="playIcon"></i>
        </button>
        <button class="btn-control" onclick="skipSession()" title="Pular">
            <i class="fa-solid fa-forward-step"></i>
        </button>
    </div>

    <div class="session-dots" id="dots"></div>

    <script>
        const modes = {
            pomodoro: { label: 'Foco', seconds: 25 * 60 },
            short: { label: 'Pausa Curta', seconds: 5 * 60 },
            long: { label: 'Pausa Longa', seconds: 15 * 60 },
        };

        let currentMode = 'pomodoro';
        let totalSeconds = modes.pomodoro.seconds;
        let remaining = totalSeconds;
        let running = false;
        let interval = null;
        let sessionsCompleted = 0;
        const CIRCUMFERENCE = 276.5;

        function setMode(mode, btn) {
            if (running) toggleTimer();
            currentMode = mode;
            totalSeconds = modes[mode].seconds;
            remaining = totalSeconds;
            document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('modeLabel').textContent = modes[mode].label;
            updateDisplay();
            updateRing();
        }

        function toggleTimer() {
            running = !running;
            const icon = document.getElementById('playIcon');
            if (running) {
                icon.className = 'fa-solid fa-pause';
                interval = setInterval(tick, 1000);
            } else {
                icon.className = 'fa-solid fa-play';
                clearInterval(interval);
            }
        }

        function tick() {
            remaining--;
            updateDisplay();
            updateRing();
            if (remaining <= 0) {
                clearInterval(interval);
                running = false;
                document.getElementById('playIcon').className = 'fa-solid fa-play';
                if (currentMode === 'pomodoro') {
                    sessionsCompleted++;
                    updateDots();
                }
                // simple beep via AudioContext
                try {
                    const ctx = new AudioContext();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.8);
                } catch(e) {}
                setTimeout(() => alert('Sessão concluída! ✅'), 100);
            }
        }

        function resetTimer() {
            if (running) toggleTimer();
            remaining = totalSeconds;
            updateDisplay();
            updateRing();
        }

        function skipSession() {
            resetTimer();
        }

        function updateDisplay() {
            const m = String(Math.floor(remaining / 60)).padStart(2, '0');
            const s = String(remaining % 60).padStart(2, '0');
            document.getElementById('display').textContent = `${m}:${s}`;
        }

        function updateRing() {
            const offset = CIRCUMFERENCE * (1 - remaining / totalSeconds);
            document.getElementById('ring').style.strokeDashoffset = offset;
        }

        function updateDots() {
            const dots = document.getElementById('dots');
            dots.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                const d = document.createElement('div');
                d.className = 'dot' + (i < sessionsCompleted % 4 ? ' done' : '');
                dots.appendChild(d);
            }
        }

        updateDots();
        updateDisplay();
    </script>
</body>
</html>
