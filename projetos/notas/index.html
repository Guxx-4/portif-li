<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h2>Controle de Notas Escolares</h2>

    <input type="text" id="nome" placeholder="Nome do aluno">

    <input type="number" id="nota1" placeholder="Nota 1">

    <input type="number" id="nota2" placeholder="Nota 2">

    <button onclick="adicionarAluno()">Adicionar</button>

    <table>

        <thead>
            <tr>
                <th>Aluno</th>
                <th>Nota 1</th>
                <th>Nota 2</th>
                <th>Média</th>
                <th>Situação</th>
            </tr>
        </thead>

        <tbody id="tabelaAlunos">

        </tbody>

    </table>

    <a href="../../index.html" class="voltar">← Voltar ao portfólio</a>

</div>

<script src="script.js"></script>

</body>
</html>
