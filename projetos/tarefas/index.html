<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            padding: 2rem 0;
            color: white;
        }
        .app-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 2rem;
            max-width: 640px;
            margin: 0 auto;
        }
        .app-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .app-title i { color: #a78bfa; }
        .input-group .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 12px 0 0 12px;
            padding: 0.75rem 1rem;
        }
        .input-group .form-control::placeholder { color: rgba(255,255,255,0.4); }
        .input-group .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: #a78bfa;
            box-shadow: none;
            color: white;
        }
        .btn-add {
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            border: none;
            border-radius: 0 12px 12px 0;
            padding: 0.75rem 1.25rem;
            color: white;
            font-weight: 600;
        }
        .btn-add:hover { background: linear-gradient(135deg, #6d28d9, #7c3aed); color: white; }
        .filters {
            display: flex;
            gap: 0.5rem;
            margin: 1.5rem 0 1rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.4rem 1rem;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: #7c3aed;
            border-color: #7c3aed;
            color: white;
        }
        .task-item {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 0.9rem 1rem;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.25s;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .task-item:hover { background: rgba(255,255,255,0.1); }
        .task-item.done .task-text {
            text-decoration: line-through;
            opacity: 0.45;
        }
        .task-check {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            cursor: pointer;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .task-check:hover { border-color: #a78bfa; }
        .task-item.done .task-check {
            background: #7c3aed;
            border-color: #7c3aed;
        }
        .task-check i { font-size: 0.7rem; display: none; }
        .task-item.done .task-check i { display: block; }
        .task-text { flex: 1; font-size: 0.95rem; }
        .btn-delete {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-delete:hover { color: #f87171; background: rgba(248,113,113,0.1); }
        .stats {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.4);
            margin-top: 1rem;
            text-align: right;
        }
        .empty-msg {
            text-align: center;
            padding: 2rem;
            color: rgba(255,255,255,0.3);
            font-size: 0.9rem;
        }
        .btn-voltar {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 1.5rem;
            transition: color 0.2s;
        }
        .btn-voltar:hover { color: white; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../index.html" class="btn-voltar">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao Portfólio
        </a>

        <div class="app-card">
            <div class="app-title">
                <i class="fa-solid fa-list-check"></i>
                Lista de Tarefas
            </div>

            <div class="input-group">
                <input type="text" id="inputTarefa" class="form-control" placeholder="Adicionar nova tarefa..." maxlength="120">
                <button class="btn btn-add" onclick="adicionarTarefa()">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <div class="filters">
                <button class="filter-btn active" onclick="filtrar('todas', this)">Todas</button>
                <button class="filter-btn" onclick="filtrar('pendentes', this)">Pendentes</button>
                <button class="filter-btn" onclick="filtrar('concluidas', this)">Concluídas</button>
            </div>

            <div id="listaTarefas"></div>
            <div class="stats" id="stats"></div>
        </div>
    </div>

    <script>
        let tarefas = JSON.parse(localStorage.getItem('tarefas_gustavo')) || [
            { id: 1, texto: 'Estudar HTML e CSS', feita: true },
            { id: 2, texto: 'Fazer exercícios de JavaScript', feita: false },
            { id: 3, texto: 'Finalizar portfólio', feita: false },
        ];
        let filtroAtual = 'todas';

        function salvar() {
            localStorage.setItem('tarefas_gustavo', JSON.stringify(tarefas));
        }

        function render() {
            const lista = document.getElementById('listaTarefas');
            const stats = document.getElementById('stats');

            let visiveis = tarefas;
            if (filtroAtual === 'pendentes') visiveis = tarefas.filter(t => !t.feita);
            if (filtroAtual === 'concluidas') visiveis = tarefas.filter(t => t.feita);

            if (visiveis.length === 0) {
                lista.innerHTML = '<div class="empty-msg"><i class="fa-solid fa-inbox"></i><br>Nenhuma tarefa aqui.</div>';
            } else {
                lista.innerHTML = visiveis.map(t => `
                    <div class="task-item ${t.feita ? 'done' : ''}" id="task-${t.id}">
                        <div class="task-check" onclick="toggleTarefa(${t.id})">
                            <i class="fa-solid fa-check text-white"></i>
                        </div>
                        <span class="task-text">${escapeHtml(t.texto)}</span>
                        <button class="btn-delete" onclick="deletarTarefa(${t.id})">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `).join('');
            }

            const total = tarefas.length;
            const feitas = tarefas.filter(t => t.feita).length;
            stats.textContent = total > 0 ? `${feitas} de ${total} concluída(s)` : '';
        }

        function adicionarTarefa() {
            const input = document.getElementById('inputTarefa');
            const texto = input.value.trim();
            if (!texto) return;
            tarefas.unshift({ id: Date.now(), texto, feita: false });
            salvar();
            render();
            input.value = '';
            input.focus();
        }

        function toggleTarefa(id) {
            const t = tarefas.find(t => t.id === id);
            if (t) t.feita = !t.feita;
            salvar();
            render();
        }

        function deletarTarefa(id) {
            tarefas = tarefas.filter(t => t.id !== id);
            salvar();
            render();
        }

        function filtrar(tipo, btn) {
            filtroAtual = tipo;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        document.getElementById('inputTarefa').addEventListener('keydown', e => {
            if (e.key === 'Enter') adicionarTarefa();
        });

        render();
    </script>
</body>
</html>
